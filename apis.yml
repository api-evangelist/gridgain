aid: gridgain
name: GridGain
description: >-
  GridGain is a unified real-time data platform that provides in-memory computing for transactions, analytics, and AI
  workloads. Built on top of Apache Ignite, it offers distributed database, caching, and computing capabilities for
  high-performance data-intensive applications.
